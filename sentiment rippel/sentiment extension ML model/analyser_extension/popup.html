<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
    h3 { margin-top: 0; color: #333; }
    button { 
      width: 100%; padding: 10px; background-color: #007bff; color: white; 
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold; 
    }
    button:hover { background-color: #0056b3; }
    .text-box { 
      margin-top: 10px; max-height: 100px; overflow-y: auto; 
      font-size: 12px; color: #555; background: #f8f9fa; padding: 8px; 
      border: 1px solid #ddd; border-radius: 4px; white-space: pre-wrap;
    }
    .result { 
      margin-top: 12px; font-weight: bold; padding: 10px; 
      border-radius: 4px; text-align: center; display: none; 
    }
    .Positive { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .Negative { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .Neutral { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
  </style>
</head>
<body>
  <h3>Page Sentiment Analyzer</h3>
  <button id="scrape-btn">Scrape & Analyze Page</button>
  
  <div id="text-preview" class="text-box" style="display:none;"></div>
  <div id="result-box" class="result"></div>

  <!-- Link our interactive script -->
  <script src="popup.js"></script>
</body>
</html>
